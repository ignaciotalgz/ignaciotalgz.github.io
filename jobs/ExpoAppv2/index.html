<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ExpoApp v2</title>
    <link rel="stylesheet" href="css/style.css">

    <!-- PWA: manifest + iconos -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a2351">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <!-- Soporte "Agregar a inicio" en iOS/Safari (no lee manifest.json) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ExpoApp">
</head>

<body>
    <!-- Banner de instalación PWA: se muestra solo si el navegador permite instalar
         y todavia no esta instalada. La logica vive en js/install-prompt.js -->
    <div id="install-banner" class="install-banner hide" role="alert">
        <img src="icons/icon-192.png" alt="" class="install-banner-icon">
        <p class="install-banner-text">
            Estás viendo la versión online. Instalá la app para acceder a este
            contenido también sin conexión.
        </p>
        <div class="install-banner-actions">
            <button id="install-banner-btn" class="install-banner-btn">Instalar</button>
            <button id="install-banner-close" class="install-banner-close" aria-label="Cerrar">
                <img src="img/x.svg" alt="">
            </button>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <div class="logo">
                <img src="img/AlGz.png" alt="">
            </div>
            <div class="config">
                <button id="settings">
                    <img src="img/settings.svg" alt="">
                </button>
                <div class="hide" id="settings-2">
                    <button id="cancel">
                        <img src="img/circle-x.svg" alt="">
                    </button>
                    <button id="save">
                        <img src="img/device-floppy.svg" alt="">
                    </button>
                </div>
            </div>
        </div>
        <div class="buttons">
            <button class="on">
                <img src="img/noto--play-button.svg" alt="">
                <h1>Tema 1</h1>
            </button>
            <button class="on">
                <img src="img/noto--play-button.svg" alt="">
                <h1>Tema 2</h1>
            </button>
            <button class="on">
                <img src="img/noto--play-button.svg" alt="">
                <h1>Tema 3</h1>
            </button>
            <button class="on">
                <img src="img/noto--play-button.svg" alt="">
                <h1>Tema 4</h1>
            </button>
            <button class="on">
                <img src="img/noto--play-button.svg" alt="">
                <h1>Tema 5</h1>
            </button>
            <button class="on">
                <img src="img/noto--play-button.svg" alt="">
                <h1>Tema 6</h1>
            </button>
        </div>
    </div>
</body>
<script src="js/app.js"></script>
<script src="js/install-prompt.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js', { scope: './' })
        .then((reg) => console.log('[SW] registrado, scope:', reg.scope))
        .catch((err) => console.error('[SW] error al registrar:', err));
    });
  }
</script>
</html>
