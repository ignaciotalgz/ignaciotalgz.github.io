<div class="flex flex-col lg:flex-row gap-6 items-start">

  <div class="flex-1 min-w-0">
    <h2 class="text-xl font-semibold text-stone-900 mb-4" i18n="@@section.about">Sobre mí</h2>

    <p class="text-stone-700 leading-relaxed">{{ profile.aboutShort }}</p>

    <div *ngIf="expanded()" class="mt-4 space-y-4">
      <p *ngFor="let paragraph of profile.aboutFull" class="text-stone-700 leading-relaxed">
        {{ paragraph }}
      </p>
    </div>

    <button (click)="toggle()"
            class="mt-4 text-sm font-medium text-amber-700 hover:text-amber-800 transition-colors">
      <span *ngIf="!expanded()" i18n="@@about.readMore">Leer más</span>
      <span *ngIf="expanded()" i18n="@@about.readLess">Leer menos</span>
    </button>
  </div>

  <div class="w-full lg:w-72 flex-shrink-0 rounded-xl border border-stone-200 bg-white p-5">
    <h3 class="text-sm font-semibold text-stone-900 mb-3" i18n="@@about.skillsTitle">Skills</h3>
    <div *ngFor="let group of skills" class="border-t border-stone-100 first:border-t-0">
      <button (click)="toggleSkill(group.category)"
              class="w-full flex items-center justify-between py-2.5 text-left">
        <span class="text-xs font-medium text-stone-600">{{ group.category }}</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             class="text-stone-400 transition-transform"
             [class.rotate-180]="isSkillExpanded(group.category)">
          <path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div *ngIf="isSkillExpanded(group.category)" class="flex flex-wrap gap-2 pb-3">
        <span *ngFor="let item of group.items"
              class="inline-flex items-center gap-1.5 text-xs px-2 py-1 rounded bg-stone-100 text-stone-700">
          <img [src]="item.icon" [alt]="item.label" class="w-3.5 h-3.5">
          {{ item.label }}
        </span>
      </div>
    </div>
  </div>

</div>
